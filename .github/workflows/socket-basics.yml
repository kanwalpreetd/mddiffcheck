# Socket Basics security scan for mddiffcheck.
# Upstream: https://github.com/SocketDev/socket-basics
# Scanner settings live in .socket-basics.json at the repo root.
#
# This is SEPARATE from socket-scan.yml. The two do different jobs:
#   socket-scan.yml   application dependency CVEs + Tier 1 reachability
#   socket-basics.yml SAST over this repo's own code + leaked-secret detection
#
# WHY THIS RUNS THE CONTAINER DIRECTLY INSTEAD OF `uses: SocketDev/socket-basics`
# ------------------------------------------------------------------------------
# The published action's action.yml declares only `using`, `image` and `env` --
# no `args` and no `entrypoint` -- so a workflow cannot pass CLI flags or a
# config file through it. Everything given via `with:` arrives as an INPUT_*
# environment variable, and socket-basics ranks its config sources:
#
#   1. CLI options                      (highest)
#   2. JSON config OR dashboard config
#   3. environment variables            (lowest)  <- where `with:` inputs land
#
# So with an API key present, the Socket dashboard config outranked every input
# we set. Observed 2026-09-09: the dashboard's all_languages_enabled=True
# overrode our single-language setting and OpenGrep ran all 13 rule files, and
# the dashboard's jira_url auto-enabled the Jira notifier, which filed tickets.
#
# Passing --config avoids both. socket-basics loads the dashboard config only
# when no JSON config is supplied, so .socket-basics.json is authoritative and
# no Jira notifier gets configured. The API key is still passed, so results are
# still submitted to the Socket dashboard.
#
# Trigger: manual only while we evaluate the tool.

name: Socket Basics security scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  socket-basics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run Socket Basics
        env:
          SOCKET_SECURITY_API_TOKEN: ${{ secrets.SOCKET_SECURITY_API_TOKEN }}
          SOCKET_ORG: stellar
        run: |
          docker run --rm \
            -v "$PWD:/github/workspace" \
            -w /github/workspace \
            -e SOCKET_SECURITY_API_TOKEN \
            -e SOCKET_ORG \
            -e GITHUB_REPOSITORY \
            -e GITHUB_REF_NAME \
            -e GITHUB_SHA \
            ghcr.io/socketdev/socket-basics:3.1.0 \
            --config .socket-basics.json
